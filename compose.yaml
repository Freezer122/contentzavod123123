services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: content_factory
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    command: ['postgres', '-c', 'shared_buffers=256MB', '-c', 'max_connections=50']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U factory -d content_factory']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
        '--maxmemory',
        '384mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
volumes:
  postgres-data:
  redis-data:
